name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    # Advisory only: findings land in the HTML report but never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run linters
        run: |
          mkdir -p lint-results
          python3 .github/ci/run_lint.py > lint-results/lint.json

      - uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results/lint.json
          retention-days: 30

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep sqlite3

      - name: Run tool smoke tests
        id: smoke
        run: |
          mkdir -p ci-results
          set +e
          python3 tools/selftest/selftest.py --ci --json-out ci-results/results.json --timeout 180
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Download lint findings
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lint-results
          path: ci-results

      - name: Render HTML report
        if: always()
        run: |
          if [ ! -f ci-results/results.json ]; then
            echo '{"ok": false, "valid": [], "invalid": [{"tool": "(selftest)", "errors": ["selftest crashed before producing results — see job log"]}], "smoke_pass": [], "smoke_fail": [], "no_smoke": [], "skipped": []}' > ci-results/results.json
          fi
          python3 tools/selftest/render_report.py ci-results/results.json \
            --lint ci-results/lint.json \
            --out ci-results/report.html \
            --md-out ci-results/summary.md \
            --sha "${{ github.sha }}" \
            --ref "${{ github.head_ref || github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --title "Agent Tools — CI Report"

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: |
            ci-results/report.html
            ci-results/results.json
            ci-results/summary.md
          retention-days: 30

      - name: Job summary
        if: always()
        run: cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Merge gate
        if: always()
        run: |
          if [ "${{ steps.smoke.outputs.exit_code }}" != "0" ]; then
            echo "❌ Smoke tests failed or never ran — merge is blocked." >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
          echo "✅ All manifests valid, all smoke tests green."
